<!doctype html><html><head><meta charset="utf-8"><title>Responsive preview</title><style>body{margin:0;background:#d8cfba;font:13px Arial;color:#4d4930}header{height:45px;display:flex;align-items:center;gap:12px;padding:0 15px}button,select{padding:6px}main{display:flex;gap:24px;padding:10px 18px}.phone{width:293px;height:633px}.phone iframe{width:390px;height:844px;transform:scale(.75);transform-origin:top left}.desktop{width:768px;height:432px}.desktop iframe{width:1280px;height:720px;transform:scale(.6);transform-origin:top left}iframe{border:0;background:#ebdfc7}pre{font:11px/1.5 monospace;white-space:pre-wrap;max-width:760px}h2{font-size:14px}</style></head><body><header><select id="target"><option value="quote">Video quote</option><option value="mempelai">The Couple</option><option value="love-story">Love Story</option><option value="lokasi">Venue</option><option value="galeri">Gallery</option><option value="rsvp">RSVP</option><option value="footer">Thank you</option></select><button id="show">View Section</button><button id="check">Inspect</button><button id="small">Layar 320px</button></header><main><div class="phone"><iframe id="mobile" title="Pratinjau mobile" src="/"></iframe></div><aside><div class="desktop"><iframe id="desktop" title="Pratinjau desktop" src="/"></iframe></div><pre id="result"></pre></aside></main><script>
const frames=[mobile,desktop];show.onclick=()=>frames.forEach(frame=>{const doc=frame.contentDocument;doc.querySelector('.local-skip')?.click();const el=target.value==='footer'?doc.querySelector('footer'):doc.getElementById(target.value);el?.scrollIntoView({block:'center',behavior:'instant'})});check.onclick=()=>{result.textContent=JSON.stringify(frames.map(frame=>{const d=frame.contentDocument,q=d.querySelector('#quote'),v=q.querySelector('video'),r=q.querySelector('blockquote').getBoundingClientRect(),b=q.getBoundingClientRect();return {viewport:frame.contentWindow.innerWidth,overflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth,quoteFits:r.width<=b.width&&r.height<=b.height,video:v?{paused:v.paused,time:v.currentTime,width:v.videoWidth,source:v.getAttribute('src'),error:v.error?.message}:null,photos:d.querySelectorAll('#galeri button img').length,missingImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src)}}),null,2)};small.onclick=()=>{mobile.style.width='320px';};
</script></body></html>
